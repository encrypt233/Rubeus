name: Build Rubeus

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # 关键步骤：直接安装 .NET 4.0 引用程序集 NuGet 包到本地目录
    - name: Install .NET 4.0 Reference Assemblies
      run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages

    - name: Build Rubeus (Release)
      run: msbuild Rubeus\Rubeus.csproj /p:Configuration=Release /p:Platform=AnyCPU

    - name: Locate Rubeus.exe
      run: Get-ChildItem -Recurse -Filter "Rubeus.exe" | Select-Object FullName

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rubeus-Build
        path: '**/bin/Release/Rubeus.exe'
