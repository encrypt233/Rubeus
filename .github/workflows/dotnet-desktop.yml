name: Build Rubeus

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Rubeus\Rubeus.csproj

    - name: Build Rubeus (Release)
      run: msbuild Rubeus\Rubeus.csproj /p:Configuration=Release /p:Platform="Any CPU"

    - name: Locate output
      run: Get-ChildItem -Recurse -Filter "Rubeus.exe" | Select-Object FullName

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rubeus-Build
        path: '**/bin/Release/Rubeus.exe'
